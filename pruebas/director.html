<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Prueba · Director (oleadas, mejoras, puntuación)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #07080a; overflow: hidden; font: 12px/1.35 ui-monospace, Consolas, monospace; }
    #juego { position: fixed; inset: 0; }
    #juego canvas { display: block; width: 100%; height: 100%; }
    #panel { position: fixed; left: 8px; bottom: 8px; z-index: 50; max-width: 46ch; padding: 8px 10px; background: rgba(8,10,14,.82); color: #cfe3ff;
      border: 1px solid #2c3a52; border-radius: 6px; pointer-events: none; white-space: pre-wrap; }
    #botones { position: fixed; right: 8px; bottom: 8px; z-index: 51; display: flex; gap: 6px; }
    #botones button { font: inherit; background: #1b2638; color: #cfe3ff; border: 1px solid #3a4e72; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="juego"></div>
  <div id="panel">Director · cargando…</div>
  <div id="botones">
    <button data-a="dia">Día +1 (F2)</button><button data-a="era">Era +1 (F3)</button><button data-a="jefe">Jefe (F4)</button>
    <button data-a="matar">Matar todos</button><button data-a="sig">Siguiente oleada</button>
  </div>
  <!-- ?auto=1 arranca solo. Parámetros: &rol=soldado,medico &dia=11 &dif=normal|facil|dificil|pesadilla &depurar=1 &sinui=1 -->
  <script type="module">
    import { esDiaDeJefe, DIA_FINAL } from '../src/datos/eras.js';
    const p = new URLSearchParams(location.search);
    if (!p.has('depurar')) { p.set('depurar', '1'); history.replaceState(null, '', '?' + p); }
    // Juego completo; si algún módulo ajeno aún no compila (o con ?solo=1) se monta uno mínimo: render + escenarios + director.
    try {
      if (p.has('solo')) throw new Error('modo solo');
      await import('../src/main.js');
    } catch (err) {
      console.warn('[director.html] modo mínimo:', err.message);
      const { Juego } = await import('../src/nucleo/juego.js');
      const { crearRender } = await import('../src/render/index.js');
      const { crearEscenarios } = await import('../src/escenarios/index.js');
      const { crearDirector } = await import('../src/oleadas/index.js');
      const juego = new Juego({ contenedor: document.getElementById('juego') });
      juego.registrar('render', crearRender(juego));
      juego.registrar('escenarios', crearEscenarios(juego));
      juego.registrar('director', crearDirector(juego));
      await juego.iniciar();
      window.juego = juego; window.__lista = true;
    }
    const panel = document.getElementById('panel');
    const J = () => window.juego;
    setInterval(() => {
      const j = J(); if (!j) return;
      const e = j.estado, d = j.director.info();
      panel.textContent =
        `fase ${e.fase}/${e.subfase}  día ${e.dia}  año ${e.anio}  era ${e.eraIdx}  hora ${e.hora.toFixed(2)}\n` +
        `zombis ${e.zombisRestantes}/${e.zombisTotales} (vivos ${d.vivos}, por aparecer ${d.porGenerar}, pulso ${d.pulso ?? '-'}, tope ${d.tope})\n` +
        `puntos ${e.puntos}  racha ${e.racha} ×${e.multiplicador}  bajas ${e.bajas}  mejor ${e.mejorRacha}\n` +
        `${e.tematica ? e.tematica.nombre + ' — ' + e.tematica.subtitulo : ''}\n${d.plan ? d.plan.composicion : ''}`;
    }, 200);
    document.getElementById('botones').addEventListener('click', (ev) => {
      const a = ev.target.dataset?.a, j = J(); if (!a || !j) return;
      const d = j.estado.dia, dr = j.director;
      if (a === 'dia') dr.saltarA(d >= DIA_FINAL ? 1 : d + 1);
      else if (a === 'era') dr.saltarA(Math.min(DIA_FINAL, Math.floor((d - 1) / 5) * 5 + 6));
      else if (a === 'jefe') { let x = d + 1; while (x <= DIA_FINAL && !esDiaDeJefe(x)) x++; dr.saltarA(x > DIA_FINAL ? 5 : x); }
      else if (a === 'matar') dr.matarTodos();
      else if (a === 'sig') dr.siguienteOleada();
    });
  </script>
</body>
</html>
