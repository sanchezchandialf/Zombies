<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Prueba · combate</title>
<style>
  #panel { position: fixed; top: 8px; left: 8px; z-index: 5; font: 12px/1.3 system-ui, sans-serif; color: #e8e2d0; background: rgba(10,12,16,.78); padding: 8px 10px; border-radius: 6px; max-width: 360px; }
  #panel b { color: #ffcf7a; }
  #panel button { margin: 2px 2px 0 0; padding: 3px 7px; background: #262b34; color: #e8e2d0; border: 1px solid #4a5160; border-radius: 4px; cursor: pointer; font: inherit; }
  #panel button.on { background: #7a4b12; border-color: #ffcf7a; }
  #hud { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 5; font: 14px system-ui, sans-serif; color: #fff; background: rgba(10,12,16,.7); padding: 6px 14px; border-radius: 6px; white-space: nowrap; }
  .num { position: fixed; z-index: 4; font: 700 15px system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; transition: transform .6s ease-out, opacity .6s; }
</style></head>
<body>
<div id="panel"></div><div id="hud"></div>
<script type="module" src="./combate.js"></script>
</body></html>
